<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Change Review</title>
    <script>
      try {
        if (localStorage.getItem("change-review-theme") === "light")
          document.documentElement.dataset.theme = "light";
      } catch (_) {}
    </script>
    <style>
      :root {
        color-scheme: dark;
        --paper: #111815;
        --surface: #19221d;
        --panel: #151e19;
        --subtle: #222e27;
        --hover: #2a382f;
        --selected: #26382c;
        --ink: #e5eae5;
        --muted: #a0afa4;
        --summary: #becac1;
        --line: #344239;
        --accent: #e7b17d;
        --tint: #33291e;
        --accent-line: #81603e;
        --green: #8fd4aa;
        --red: #f1a6ae;
        --add: #193b29;
        --del: #3b252c;
        --line-number: #a3b4a7;
        --code-surface: #111a15;
        --shadow: #0007;
        --backdrop: #050a08b8;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --paper: #faf9f6;
        --surface: #fff;
        --panel: #f5f5f0;
        --subtle: #f0f2ed;
        --hover: #e9ede6;
        --selected: #ebece6;
        --ink: #262a2b;
        --muted: #626e66;
        --summary: #535c58;
        --line: #e4e6e1;
        --accent: #99501c;
        --tint: #fbf0e3;
        --accent-line: #c79b6f;
        --green: #236a4f;
        --red: #a33e47;
        --add: #eaf5ed;
        --del: #fbeef0;
        --line-number: #66796b;
        --code-surface: #f7f8f4;
        --shadow: #202a2820;
        --backdrop: #16231c66;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      input::placeholder {
        color: var(--muted);
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      summary:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 7px;
        padding: 6px 10px;
      }
      button:hover {
        background: var(--hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      header {
        height: 64px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        gap: 20px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #theme-toggle {
        font-size: 12px;
        white-space: nowrap;
      }
      .brand {
        font-weight: 650;
        letter-spacing: -0.5px;
        font-size: 18px;
        white-space: nowrap;
      }
      .brand span {
        color: var(--accent);
        margin-right: 9px;
      }
      .eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--muted);
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      p code {
        font:
          0.92em ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        background: var(--subtle);
        padding: 1px 3px;
        border-radius: 3px;
      }
      .chip {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 7px;
        font-size: 11px;
        color: var(--muted);
        background: var(--surface);
      }
      .chip.focus {
        color: var(--accent);
        background: var(--tint);
        border-color: var(--accent-line);
      }
      .chip.mechanical {
        color: var(--muted);
        background: var(--subtle);
      }
      .layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        max-width: 1500px;
        margin: 0 auto;
        min-height: calc(100vh - 64px);
      }
      nav {
        padding: 26px 16px;
        border-right: 1px solid var(--line);
      }
      .nav-inner {
        position: sticky;
        top: 24px;
        max-height: calc(100vh - 48px);
        overflow: auto;
      }
      #search {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        margin: 14px 0 12px;
        background: var(--surface);
      }
      #order {
        width: 100%;
        padding: 7px;
        margin: 6px 0 20px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        font-size: 12px;
      }
      #files {
        margin: 10px -6px 25px;
      }
      .file-link {
        display: block;
        text-align: left;
        width: 100%;
        background: transparent;
        border: 0;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 3px;
        overflow-wrap: anywhere;
      }
      .file-link[aria-current="true"] {
        background: var(--selected);
      }
      .file-link strong {
        font-weight: 550;
        display: block;
        font-size: 12px;
      }
      .file-link .folder {
        font-size: 10px;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }
      .counts {
        font:
          11px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .plus {
        color: var(--green);
      }
      .minus {
        color: var(--red);
      }
      main {
        min-width: 0;
        padding: 28px 28px 70px;
      }
      h1 {
        margin: 6px 0 12px;
        font:
          500 28px/1.2 Georgia,
          serif;
        letter-spacing: -0.5px;
        overflow-wrap: anywhere;
      }
      #summary {
        font-size: 14px;
        color: var(--summary);
        max-width: 820px;
        margin: 0 0 16px;
      }
      .metadata {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
      }
      .notice {
        padding: 12px 15px;
        border-left: 3px solid var(--accent-line);
        background: var(--tint);
        color: var(--accent);
        font-size: 12px;
        margin: 12px 0;
      }
      details {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 7px;
        padding: 10px 12px;
        margin: 10px 0;
      }
      summary {
        cursor: pointer;
        font-size: 12px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.65 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .file-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .file-title {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        overflow-wrap: anywhere;
        font-weight: 600;
      }
      .hunk {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        margin-bottom: 20px;
        scroll-margin-top: 20px;
      }
      .hunk-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 15px;
        border-bottom: 1px solid var(--line);
      }
      .hunk-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 0;
      }
      .collapse-button {
        display: flex;
        align-items: center;
        gap: 9px;
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .collapse-button::before {
        content: "▾";
        color: var(--muted);
      }
      .is-collapsed .collapse-button::before {
        content: "▸";
      }
      .is-collapsed .hunk-top {
        border-bottom: 0;
      }
      .hint {
        position: relative;
        display: inline-block;
      }
      .context-button {
        font-size: 11px;
        border: 0;
        padding: 4px 7px;
        background: var(--subtle);
        white-space: nowrap;
      }
      .peek {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        width: 290px;
        padding: 15px;
        border: 1px solid var(--line);
        background: var(--surface);
        box-shadow: 0 12px 36px var(--shadow);
        border-radius: 8px;
        z-index: 5;
        font-size: 12px;
        font-weight: 400;
      }
      .hint:not(.dismissed):hover .peek,
      .hint:not(.dismissed):focus-within .peek {
        display: block;
      }
      .peek p {
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .hunk-location {
        padding: 6px 14px;
        font:
          10px/1.5 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        color: var(--muted);
        background: var(--subtle);
        overflow-wrap: anywhere;
      }
      .code {
        overflow-x: auto;
        padding: 6px 0;
      }
      .code-line {
        display: grid;
        grid-template-columns: 37px 37px 20px 1fr;
        min-width: max-content;
        font:
          11.5px/1.9 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        padding-right: 18px;
        border-left: 3px solid transparent;
      }
      .code-line.add {
        background: var(--add);
      }
      .code-line.del {
        background: var(--del);
      }
      .hunk.important .code-line.add,
      .hunk.important .code-line.del {
        border-left-color: var(--accent);
      }
      .line-number {
        color: var(--line-number);
        text-align: right;
        padding-right: 8px;
        user-select: none;
      }
      .sign {
        text-align: center;
        color: var(--muted);
        user-select: none;
      }
      .line-text {
        white-space: pre;
      }
      .hunk-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 13px;
        border-top: 1px solid var(--line);
        font-size: 11px;
      }
      .read-button {
        border: 0;
        padding: 3px 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .read-button[aria-pressed="true"] {
        color: var(--green);
      }
      .file-section {
        margin-top: 30px;
        scroll-margin-top: 16px;
      }
      .file-heading {
        min-width: 0;
      }
      .file-reason {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
      }
      .inline-context {
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0 0 9px 9px;
        margin: 0;
        padding: 10px 14px;
        background: var(--panel);
      }
      .inline-context > summary {
        width: fit-content;
        color: var(--muted);
      }
      .context-body {
        max-width: 800px;
        padding-top: 6px;
      }
      .context-body p {
        margin: 8px 0 12px;
        overflow-wrap: anywhere;
      }
      .context-body h3 {
        font-size: 12px;
        margin: 18px 0 6px;
      }
      .connections {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }
      .connection {
        max-width: 100%;
        text-align: left;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .connection small {
        display: block;
        color: var(--muted);
      }
      .check {
        flex: 1;
        margin: 0;
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      .hunk-foot {
        gap: 16px;
      }
      .read-button {
        margin-left: auto;
        white-space: nowrap;
      }
      .snapshot-details {
        margin-bottom: 20px;
      }
      .snapshot-details > p {
        max-width: 800px;
      }
      .evidence-link {
        display: block;
        width: 100%;
        text-align: left;
        font-size: 11px;
        padding: 8px 10px;
        margin: 6px 0;
        overflow-wrap: anywhere;
      }
      .progress {
        height: 3px;
        background: var(--line);
        margin: 7px 0;
        border-radius: 4px;
      }
      .progress > div {
        height: 100%;
        background: var(--green);
        transition: width 0.2s;
      }
      .empty {
        text-align: center;
        padding: 45px 10px;
        color: var(--muted);
      }
      dialog {
        color: var(--ink);
        background: var(--surface);
        width: min(900px, 92vw);
        max-height: 85vh;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 20px 70px var(--shadow);
      }
      dialog::backdrop {
        background: var(--backdrop);
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      #evidence-code {
        overflow: auto;
        white-space: pre;
        background: var(--code-surface);
        padding: 15px;
        border-radius: 6px;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 180px minmax(0, 1fr);
        }
        main {
          padding: 22px 16px 50px;
        }
        header {
          padding: 0 18px;
        }
        header .small {
          display: none;
        }
        h1 {
          font-size: 24px;
        }
      }
      @media (max-width: 600px) {
        .snapshot-badge {
          display: none;
        }
        .layout {
          display: block;
        }
        nav {
          padding: 15px;
          border-bottom: 1px solid var(--line);
        }
        .nav-inner {
          position: static;
          max-height: none;
        }
        #files {
          max-height: 140px;
          overflow: auto;
          margin-bottom: 12px;
        }
        #search {
          margin-top: 8px;
        }
        #order {
          margin-bottom: 12px;
        }
        .peek {
          width: min(270px, 75vw);
        }
        .hunk-top {
          padding: 10px;
        }
        .code-line {
          grid-template-columns: 28px 28px 16px 1fr;
        }
        .file-section {
          margin-top: 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress > div {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span>◈</span>Change Review</div>
      <div class="muted small">The diff, with context.</div>
      <div class="header-actions">
        <button
          id="theme-toggle"
          type="button"
          aria-label="Switch to light mode"
        >
          ☀ Light
        </button>
        <span class="chip snapshot-badge">LOCAL SNAPSHOT</span>
      </div>
    </header>
    <div class="layout">
      <nav aria-label="Changed files">
        <div class="nav-inner">
          <div class="eyebrow">Changed files</div>
          <input
            id="search"
            type="search"
            placeholder="Find a file or concept…"
            aria-label="Find a file or concept"
          />
          <label for="order" class="small muted">Read in</label>
          <select id="order">
            <option value="review">Suggested review order</option>
            <option value="path">File path order</option>
          </select>
          <div class="eyebrow" id="file-count"></div>
          <div id="files"></div>
          <div class="progress"><div id="progress-bar"></div></div>
          <div class="muted small" id="progress-label"></div>
        </div>
      </nav>
      <main>
        <h1 id="title"></h1>
        <p id="summary" hidden></p>
        <div class="metadata" id="metadata"></div>
        <div id="notices"></div>
        <details class="snapshot-details" id="review-details">
          <summary>Review context &amp; sources</summary>
          <p id="overview" hidden></p>
          <details id="intent-details">
            <summary>Original request &amp; PR context</summary>
            <pre id="intent"></pre>
          </details>
          <div id="sources"></div>
          <p class="small muted">
            Explanations suggest what to inspect. They do not establish
            correctness.
          </p>
        </details>
        <div id="diff"></div>
      </main>
    </div>
    <dialog id="evidence-dialog" aria-labelledby="evidence-title">
      <div class="dialog-head">
        <strong id="evidence-title"></strong
        ><button id="close-evidence">Close</button>
      </div>
      <p class="small muted" id="evidence-meta"></p>
      <pre id="evidence-code"></pre>
    </dialog>
    <script id="review-data" type="application/json">
      __REVIEW_DATA__
    </script>
    <script>
      const { snapshot: S, review: R } = JSON.parse(
        document.getElementById("review-data").textContent,
      );
      const $ = (id) => document.getElementById(id);
      function updateThemeButton() {
        const dark = document.documentElement.dataset.theme === "dark";
        $("theme-toggle").textContent = dark ? "☀ Light" : "☾ Dark";
        $("theme-toggle").setAttribute(
          "aria-label",
          dark ? "Switch to light mode" : "Switch to dark mode",
        );
      }
      $("theme-toggle").onclick = () => {
        const theme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        try {
          localStorage.setItem("change-review-theme", theme);
        } catch (_) {}
        updateThemeButton();
      };
      updateThemeButton();
      const annotations = new Map(
        (R?.annotations || []).map((a) => [a.hunk_id, a]),
      );
      const hunks = S.files.flatMap((f) =>
        f.hunks.map((h) => ({ ...h, file: f })),
      );
      const hunkMap = new Map(hunks.map((h) => [h.id, h]));
      let selectedFile,
        query = "";
      const expanded = new Set();
      const annotationOrder = new Map(
        (R?.annotations || []).map((a, i) => [a.hunk_id, i]),
      );
      function priority(file) {
        if (
          file.hunks.some((h) => annotations.get(h.id)?.importance === "focus")
        )
          return 0;
        if (
          file.hunks.length &&
          file.hunks.every(
            (h) => annotations.get(h.id)?.importance === "mechanical",
          )
        )
          return 2;
        return 1;
      }
      function routePosition(file) {
        return Math.min(
          ...file.hunks.map((h) => annotationOrder.get(h.id) ?? Infinity),
        );
      }
      function reason(file) {
        if (!R) return "";
        if (priority(file) === 0) return "Review focus";
        if (priority(file) === 2) return "Mechanical only";
        if (
          file.hunks.some((h) => !annotations.has(h.id)) ||
          !file.hunks.length
        )
          return "Not assessed";
        return "Supporting changes";
      }
      let read = new Set();
      try {
        const saved = JSON.parse(
          localStorage.getItem("change-review:" + S.snapshot_id) || "[]",
        );
        if (Array.isArray(saved))
          read = new Set(saved.filter((id) => hunkMap.has(id)));
      } catch (_) {}
      const collapsed = new Set(read);
      function prose(node, text) {
        for (const part of text.split(/(`[^`]+`)/g))
          node.append(
            part.startsWith("`") && part.endsWith("`")
              ? el("code", part.slice(1, -1))
              : document.createTextNode(part),
          );
      }
      function el(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) {
          if (tag === "p") prose(node, text);
          else node.textContent = text;
        }
        if (className) node.className = className;
        return node;
      }
      function button(text, action, className) {
        const node = el("button", text, className);
        node.onclick = action;
        return node;
      }
      function matches(h, f) {
        return (
          !query ||
          (
            f.path +
            " " +
            JSON.stringify(annotations.get(h.id) || {}) +
            " " +
            h.lines.map((l) => l.text).join(" ")
          )
            .toLowerCase()
            .includes(query)
        );
      }
      function visibleFiles() {
        const files = S.files.filter(
          (f) =>
            f.hunks.some((h) => matches(h, f)) ||
            (!f.hunks.length && f.path.toLowerCase().includes(query)),
        );
        return files.sort((a, b) => {
          if ($("order").value === "path") return a.path.localeCompare(b.path);
          return (
            priority(a) - priority(b) ||
            routePosition(a) - routePosition(b) ||
            a.path.localeCompare(b.path)
          );
        });
      }
      function counts(f) {
        const lines = f.hunks.flatMap((h) => h.lines);
        const node = el("span", undefined, "counts");
        node.append(
          el(
            "span",
            "+" + lines.filter((l) => l.kind === "add").length,
            "plus",
          ),
          el(
            "span",
            "  −" + lines.filter((l) => l.kind === "del").length,
            "minus",
          ),
        );
        return node;
      }
      function progress() {
        $("progress-label").textContent =
          `${read.size} of ${hunks.length} blocks read`;
        $("progress-bar").style.width =
          (hunks.length ? (read.size / hunks.length) * 100 : 0) + "%";
      }
      function activeFile(id) {
        if (selectedFile === id) return;
        selectedFile = id;
        for (const node of $("files").children)
          node.setAttribute("aria-current", String(node.dataset.file === id));
      }
      function jump(id) {
        const target = $(id);
        if (!target) return;
        target.focus({ preventScroll: true });
        target.scrollIntoView({
          behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "instant"
            : "smooth",
          block: "start",
        });
      }
      function choose(id) {
        const h = hunkMap.get(id);
        if (!h) return;
        if (!matches(h, h.file)) {
          query = "";
          $("search").value = "";
          draw();
        }
        activeFile(h.file.id);
        if (collapsed.has(id)) $(id).querySelector(".collapse-button").click();
        jump(id);
      }
      function showEvidence(e) {
        $("evidence-title").textContent = `${e.path}:${e.start}`;
        $("evidence-meta").textContent =
          `${e.side === "before" ? "Before · " + S.base.slice(0, 10) : "After · " + (S.working_tree ? "captured working tree" : S.head.slice(0, 10))} · snapshot ${S.snapshot_id.slice(0, 12)}`;
        $("evidence-code").textContent = e.content
          .split("\n")
          .map((line, i) => String(e.start + i).padStart(4) + "  " + line)
          .join("\n");
        $("evidence-dialog").showModal();
      }
      function context(h, a) {
        const details = el("details", undefined, "inline-context");
        details.id = "context-" + h.id;
        details.open = expanded.has(h.id);
        details.append(el("summary", a ? "Explore context" : "Source context"));
        const root = el("div", undefined, "context-body");
        if (a) {
          root.append(el("p", a.what));
          if (a.why) {
            root.append(
              el("h3", "Why?"),
              el("span", a.why_basis, "chip"),
              el("p", a.why),
            );
          }
          if (a.where || a.related_hunks.length) {
            root.append(el("h3", "Connected changes"));
            if (a.where) root.append(el("p", a.where));
            const links = el("div", undefined, "connections");
            links.append(el("span", h.file.path, "chip"));
            for (const id of a.related_hunks) {
              const related = hunkMap.get(id);
              const link = button(
                related.file.path,
                () => choose(id),
                "connection",
              );
              link.append(
                el(
                  "small",
                  annotations.get(id)?.title ||
                    related.symbol ||
                    "Changed block",
                ),
              );
              links.append(el("span", "↔", "muted"), link);
            }
            if (a.related_hunks.length) root.append(links);
          }
        }
        const sources = S.evidence.filter((e) =>
          a ? a.evidence_ids.includes(e.id) : e.path === h.file.path,
        );
        const evidence = el("details");
        evidence.append(el("summary", `Evidence · ${sources.length} excerpts`));
        if (!sources.length)
          evidence.append(
            el("p", "No source excerpt cited for this block.", "muted"),
          );
        for (const e of sources) {
          const unchanged = !S.files.some((f) => f.path === e.path);
          evidence.append(
            button(
              `${e.path}:${e.start} · ${e.side}${unchanged ? " · unchanged file" : ""}`,
              () => showEvidence(e),
              "evidence-link",
            ),
          );
        }
        root.append(evidence);
        details.append(root);
        details.addEventListener("toggle", () => {
          if (details.open) expanded.add(h.id);
          else expanded.delete(h.id);
          $("peek-button-" + h.id)?.setAttribute(
            "aria-expanded",
            String(details.open),
          );
        });
        return details;
      }
      function renderHunk(h, file) {
        const a = annotations.get(h.id);
        const card = el(
          "article",
          undefined,
          "hunk" +
            (a?.importance === "focus" ? " important" : "") +
            (read.has(h.id) ? " is-read" : ""),
        );
        card.id = h.id;
        card.tabIndex = -1;
        const top = el("div", undefined, "hunk-top");
        const title = a?.title || h.symbol || "Changed block";
        const body = el("div", undefined, "hunk-body");
        body.id = "body-" + h.id;
        const collapse = button(
          title,
          () => setCollapsed(!collapsed.has(h.id)),
          "collapse-button hunk-title",
        );
        collapse.setAttribute("aria-controls", body.id);
        function setCollapsed(value) {
          if (value) collapsed.add(h.id);
          else collapsed.delete(h.id);
          body.hidden = value;
          card.classList.toggle("is-collapsed", value);
          collapse.setAttribute("aria-expanded", String(!value));
          collapse.setAttribute(
            "aria-label",
            `${value ? "Expand" : "Collapse"} change: ${title}`,
          );
        }
        setCollapsed(collapsed.has(h.id));
        top.append(collapse);
        const details = context({ ...h, file }, a);
        const hint = el("div", undefined, "hint");
        const pin = button(
          "ⓘ",
          () => {
            const wasCollapsed = collapsed.has(h.id);
            setCollapsed(false);
            details.open = wasCollapsed || !details.open;
            hint.classList.add("dismissed");
          },
          "context-button",
        );
        pin.id = "peek-button-" + h.id;
        pin.setAttribute(
          "aria-label",
          "Explore: " + (a?.title || h.symbol || file.path),
        );
        pin.setAttribute("aria-controls", details.id);
        pin.setAttribute("aria-expanded", String(details.open));
        const peek = el("div", undefined, "peek");
        peek.id = "peek-" + h.id;
        peek.setAttribute("role", "tooltip");
        peek.append(el("p", a?.what || "Open captured source excerpts."));
        pin.setAttribute("aria-describedby", peek.id);
        hint.append(pin, peek);
        hint.addEventListener("keydown", (event) => {
          if (event.key === "Escape") hint.classList.add("dismissed");
        });
        hint.addEventListener("mouseenter", () =>
          hint.classList.remove("dismissed"),
        );
        pin.addEventListener("focus", () => hint.classList.remove("dismissed"));
        body.append(el("div", h.header, "hunk-location"));
        const code = el("div", undefined, "code");
        for (const line of h.lines) {
          const row = el("div", undefined, "code-line " + line.kind);
          row.append(
            el("span", line.old == null ? "" : String(line.old), "line-number"),
            el("span", line.new == null ? "" : String(line.new), "line-number"),
            el(
              "span",
              line.kind === "add" ? "+" : line.kind === "del" ? "−" : "",
              "sign",
            ),
            el("span", line.text, "line-text"),
          );
          code.append(row);
        }
        body.append(code);
        const foot = el("div", undefined, "hunk-foot");
        if (a?.check) foot.append(el("p", a.check, "check"));
        const mark = button(
          read.has(h.id) ? "✓ Read" : "Mark read",
          () => {
            if (read.has(h.id)) read.delete(h.id);
            else read.add(h.id);
            try {
              localStorage.setItem(
                "change-review:" + S.snapshot_id,
                JSON.stringify([...read]),
              );
            } catch (_) {}
            mark.textContent = read.has(h.id) ? "✓ Read" : "Mark read";
            mark.setAttribute("aria-pressed", String(read.has(h.id)));
            card.classList.toggle("is-read", read.has(h.id));
            setCollapsed(read.has(h.id));
            progress();
          },
          "read-button",
        );
        mark.setAttribute("aria-pressed", String(read.has(h.id)));
        top.append(mark, hint);
        if (a?.check) body.append(foot);
        body.append(details);
        card.append(top, body);
        return card;
      }
      function draw() {
        const files = visibleFiles();
        selectedFile = undefined;
        $("file-count").textContent =
          `${files.length} of ${S.files.length} files`;
        $("files").replaceChildren();
        const diff = $("diff");
        diff.replaceChildren();
        for (const file of files) {
          const node = button(
            "",
            () => {
              activeFile(file.id);
              jump(file.id);
            },
            "file-link",
          );
          node.dataset.file = file.id;
          node.setAttribute("aria-label", file.path);
          const parts = file.path.split("/");
          const name = parts.pop();
          if (parts.length)
            node.append(el("span", parts.join("/") + "/", "folder"));
          node.append(el("strong", name), counts(file));
          $("files").append(node);
          const section = el("section", undefined, "file-section");
          section.id = file.id;
          section.tabIndex = -1;
          section.setAttribute("aria-label", file.path);
          const heading = el("div", undefined, "file-header");
          const nameplate = el("div", undefined, "file-heading");
          nameplate.append(el("div", file.path, "file-title"));
          if (reason(file))
            nameplate.append(el("span", reason(file), "file-reason"));
          heading.append(nameplate, counts(file));
          section.append(heading);
          if (!file.hunks.length) section.append(el("pre", file.patch));
          for (const h of file.hunks.filter((h) => matches(h, file)))
            section.append(renderHunk(h, file));
          diff.append(section);
        }
        if (!files.length)
          diff.append(
            el(
              "div",
              S.files.length
                ? "No changes match this search."
                : S.omitted.length
                  ? "All changed files were omitted. See the reasons above."
                  : "No changes in this comparison.",
              "empty",
            ),
          );
        activeFile(files[0]?.id);
        progress();
      }
      $("title").textContent = S.title;
      document.title = S.title + " · Change Review";
      if (R?.summary) {
        const target = R.summary.length <= 120 ? $("summary") : $("overview");
        target.hidden = false;
        prose(target, R.summary);
      }
      $("metadata").append(
        el("span", S.branch, "chip"),
        el(
          "span",
          S.base.slice(0, 8) +
            " → " +
            (S.working_tree ? "working tree" : S.head.slice(0, 8)),
          "chip",
        ),
        el("span", `${S.files.length} files · ${hunks.length} blocks`, "chip"),
      );
      $("intent").textContent =
        [
          S.intent,
          S.pr
            ? `PR #${S.pr.number}: ${S.pr.title}\n${S.pr.url}\n\n${S.pr.body}`
            : "",
        ]
          .filter(Boolean)
          .join("\n\n") ||
        "No original request was supplied. Any rationale must be treated as inferred.";
      if (!R)
        $("notices").append(
          el(
            "div",
            "Diff only · explanations have not been generated.",
            "notice",
          ),
        );
      else if (annotations.size < hunks.length)
        $("notices").append(
          el(
            "div",
            `${hunks.length - annotations.size} blocks have no explanation.`,
            "notice",
          ),
        );
      if (S.omitted.length) {
        const omitted = el("details");
        omitted.append(
          el(
            "summary",
            `${S.omitted.length} files omitted — this review is incomplete`,
          ),
        );
        for (const item of S.omitted)
          omitted.append(el("p", item.path + ": " + item.reason, "small"));
        $("notices").append(omitted);
      }
      const evidence = el("details");
      evidence.append(
        el(
          "summary",
          `Browse all source context (${S.evidence.length} excerpts)`,
        ),
        el("p", S.context_note, "small muted"),
      );
      for (const e of S.evidence)
        evidence.append(
          button(
            `${e.path}:${e.start} · ${e.side}`,
            () => showEvidence(e),
            "evidence-link",
          ),
        );
      $("sources").append(evidence);
      $("search").oninput = (event) => {
        query = event.target.value.toLowerCase();
        draw();
      };
      $("order").onchange = draw;
      if (!R?.annotations.length) {
        $("order").value = "path";
        $("order").options[0].disabled = true;
      }
      let scrollPending = false;
      window.addEventListener(
        "scroll",
        () => {
          if (scrollPending) return;
          scrollPending = true;
          requestAnimationFrame(() => {
            scrollPending = false;
            const sections = [...document.querySelectorAll(".file-section")];
            let current = sections[0];
            for (const section of sections) {
              if (section.getBoundingClientRect().top > 120) break;
              current = section;
            }
            activeFile(current?.id);
          });
        },
        { passive: true },
      );
      $("close-evidence").onclick = () => $("evidence-dialog").close();
      draw();
    </script>
  </body>
</html>
